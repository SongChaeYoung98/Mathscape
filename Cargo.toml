[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/math-core",
  "crates/project-format",
  "crates/animation-core",
  "crates/render-core"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
